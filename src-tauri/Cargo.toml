[package]
name = "nexuscode"
version = "1.0.1"
description = "NexusCode — Where Code Meets Intelligence"
authors = ["V1nskiy"]
edition = "2021"

[lib]
# Desktop-only app: rlib is enough. cdylib/staticlib (mobile targets) blow past
# the PE export ordinal limit (65535) under the windows-gnu linker.
name = "nexuscode_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
hex = "0.4"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
regex = "1"
glob = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
base64 = "0.22"
portable-pty = "0.8"
cpal = "0.15"
hound = "3.5"
sha2 = "0.10"
semver = "1"
encoding_rs = "0.8"
keyring = "3"

[profile.release]
# Smaller, leaner release binary (slower build — release only).
# strip removes symbols (harder reverse engineering), debug off kills
# debug info entirely, panic=abort drops unwinding tables.
strip = true
lto = true
opt-level = "s"
codegen-units = 1
debug = false
panic = "abort"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_ToolHelp",
] }

